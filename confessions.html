<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confessions — MedReform</title>
<meta name="description" content="Anonymous confessions from COMJNMH. Automatically checked for hate speech and harmful content.">

<meta property="og:type" content="website">
<meta property="og:title" content="Confessions — MedReform">
<meta property="og:description" content="Anonymous confessions from COMJNMH, checked automatically.">
<meta property="og:image" content="/og-image.png">

<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=Epilogue:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="site-header">
  <a href="/" class="logo">
    <div class="logo-mark">M+</div>
    <div>
      <div class="logo-text">MedReform</div>
      <div class="logo-sub">COMJNMH · Kalyani</div>
    </div>
  </a>
  <nav class="desktop-nav">
    <a href="/" class="nav-link active">Confessions</a>
    <a href="/ideas" class="nav-link">Ideas</a>
    <a href="/submit" class="nav-link">Submit</a>
    <a href="/snakes" class="nav-link">Snakes</a>
  </nav>
  <span class="badge live">Anonymous</span>
</header>

<div class="submit-wrap">
  <div class="submit-header">
    <h1>Confessions</h1>
    <p>Anonymous. Every post is checked automatically for hate speech and harmful content before it appears. Nothing is reviewed by hand.</p>
  </div>

  <form class="form-card" id="confess-form">
    <div class="form-group">
      <label class="form-label" for="confess-body">Your confession</label>
      <textarea class="form-textarea" id="confess-body" name="body" rows="5" maxlength="1000" required></textarea>
    </div>
    <div class="form-group">
      <button type="submit" class="btn-primary" id="confess-submit">Submit anonymously</button>
      <p id="confess-msg" role="status"></p>
    </div>
  </form>

  <div class="ideas-list" id="confess-list" aria-live="polite"></div>
</div>

<nav class="mobile-nav">
  <a href="/" class="mob-tab active"><span class="mob-icon">⌂</span><span>Confessions</span></a>
  <a href="/ideas" class="mob-tab"><span class="mob-icon">≡</span><span>Ideas</span></a>
  <a href="/submit" class="mob-tab"><span class="mob-icon">✎</span><span>Submit</span></a>
  <a href="/snakes" class="mob-tab"><span class="mob-icon">🐍</span><span>Snakes</span></a>
</nav>

<script>
const SUPABASE_URL = 'https://btkkofaeksuyupajsigj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_jlT-cFu5qh-P43YKF73Fvg_lMqajMiE';

const form = document.getElementById('confess-form');
const msg = document.getElementById('confess-msg');
const list = document.getElementById('confess-list');
const submitBtn = document.getElementById('confess-submit');

const MESSAGES = {
  rejected: 'This post was not published because it breaks the rules (hate speech or harmful content).',
  moderation_unavailable: 'Could not check your post right now. Please try again later.',
  length_must_be_1_to_1000: 'Please write between 1 and 1000 characters.',
};

function renderList(rows) {
  list.textContent = '';
  if (!rows.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'No confessions yet.';
    list.append(empty);
    return;
  }
  rows.forEach(function (row) {
    const card = document.createElement('article');
    card.className = 'idea-card';
    const body = document.createElement('p');
    body.className = 'idea-text';
    body.textContent = row.body;
    const when = document.createElement('div');
    when.className = 'idea-time';
    when.textContent = new Date(row.created_at).toLocaleString();
    card.append(body, when);
    list.append(card);
  });
}

async function loadList() {
  try {
    const res = await fetch(
      SUPABASE_URL + '/rest/v1/confessions?select=id,body,created_at&order=created_at.desc&limit=100',
      { headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY } }
    );
    if (!res.ok) throw new Error('load_failed');
    renderList(await res.json());
  } catch (e) {
    msg.textContent = 'Could not load confessions. Please refresh.';
  }
}

form.addEventListener('submit', async function (e) {
  e.preventDefault();
  const body = document.getElementById('confess-body').value.trim();
  submitBtn.disabled = true;
  msg.textContent = 'Checking…';
  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/submit-confession', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY },
      body: JSON.stringify({ body: body }),
    });
    const data = await res.json().catch(function () { return {}; });
    if (res.status === 201) {
      msg.textContent = 'Published.';
      form.reset();
      loadList();
    } else {
      msg.textContent = MESSAGES[data.error] || 'Something went wrong. Please try again.';
    }
  } catch (err) {
    msg.textContent = 'Network error. Please try again.';
  } finally {
    submitBtn.disabled = false;
  }
});

loadList();
</script>
</body>
</html>
